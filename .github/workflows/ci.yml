name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore Lokad.Sift.slnx --locked-mode --tl:off -v minimal
      - name: Build Release solution
        shell: pwsh
        run: dotnet build Lokad.Sift.slnx -c Release --no-restore --tl:off --nologo -v minimal
      - name: Test Release
        shell: pwsh
        env:
          DOTNET_DbgEnableMiniDump: 1
          DOTNET_DbgMiniDumpType: Mini
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/crash-%p.dmp
        run: |
          New-Item -ItemType Directory -Path artifacts/ci -Force | Out-Null
          try { ./test.ps1 -Configuration Release -SkipBuild 2>&1 | Tee-Object -FilePath artifacts/ci/test.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Verify Release package consumers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/ci -Force | Out-Null
          try { ./tools/verify-regex-package.ps1 2>&1 | Tee-Object -FilePath artifacts/ci/package.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/crash-*.dmp
            ${{ github.workspace }}/**/TestResults/**/Sequence_*.xml
            ${{ github.workspace }}/**/TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs-${{ matrix.os }}
          path: artifacts/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
